name: daily-job-search

on:
  schedule:
    # 04:00 UTC — edit to have results ready by morning in your own timezone.
    - cron: "0 4 * * *"
  workflow_dispatch: {}

# A new run cancels an unfinished previous one instead of both burning tokens.
concurrency:
  group: daily-job-search
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10          # a hung run dies on its own
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen        # uses the committed uv.lock

      # data/master_cv.json is gitignored (it's your real resume), so the run
      # gets it from a repo Secret instead. If the secret is missing, the
      # pipeline's own "master_cv.json not found" error fails the run — which
      # also fires the ntfy failure push.
      - name: Write master CV from secret
        env:
          MASTER_CV_JSON: ${{ secrets.MASTER_CV_JSON }}
        run: |
          if [ -n "$MASTER_CV_JSON" ]; then
            printf '%s' "$MASTER_CV_JSON" > data/master_cv.json
          else
            echo "::warning::MASTER_CV_JSON secret is not set; the run will fail without data/master_cv.json."
          fi

      - name: Run pipeline
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          # Optional repo Variables (Settings -> Secrets and variables ->
          # Actions -> Variables tab, NOT Secrets — these aren't sensitive).
          # Set them to switch LLM provider/model without touching
          # config.yaml or making a commit. Empty/unset falls through to
          # config.yaml, then src/llm.py's built-in default.
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: uv run python -m src.main
