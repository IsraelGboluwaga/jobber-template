# Daily job-search pipeline — pipeline/ops settings live here.
# Your job-search criteria (titles, locations, geo rules, salary) live in
# preferences.yaml instead — that's the file to edit for a fresh clone.
# Nothing secret goes in either file. Secrets come from environment variables
# (see .env.example). Both files ARE committed.

source:
  # Rank postings whose direct apply URL resolves to a company ATS
  # (Greenhouse/Lever/Ashby) above plain board listings.
  prefer_direct: true

llm:
  # Any OpenAI-compatible chat-completions endpoint works here. `model` and
  # `base_url` are OPTIONAL — src/llm.py's PROVIDER_DEFAULTS fills in a known
  # provider's defaults when they're omitted (see that file for the current
  # list: deepseek, openai, anthropic). `provider` itself, and `model`, can
  # also be set via the LLM_PROVIDER / LLM_MODEL env vars instead of editing
  # this file — handy for a quick local swap, or a GitHub Actions repo
  # Variable so a fork can switch provider without a commit. Env wins over
  # what's here; what's here wins over the built-in default. The API key
  # always comes from LLM_API_KEY regardless of provider.
  #
  # Only base_url has no env override. A provider with no built-in default
  # (Groq, a local vLLM/Ollama server, ...) needs it set explicitly, e.g.:
  #   provider: local  model: <served-model-name>  base_url: http://localhost:11434/v1
  provider: deepseek
  # Overrides PROVIDER_DEFAULTS' "deepseek-chat" — pick your own DeepSeek tier
  # here, or delete this line to take the built-in default.
  model: deepseek-flash
  # Thinking/reasoning toggle — only meaningful for providers that support it
  # (currently applied when the resolved provider is deepseek). Harmless
  # no-op otherwise.
  thinking: false
  max_tokens_cv: 1500
  max_tokens_answers: 800
  # Pre-flight budget guard. Aborts the run if the estimate exceeds the ceiling.
  rough_tokens_per_job: 4000
  budget_ceiling_tokens: 80000

rollover:
  archive_new_after_days: 14   # New rows older than this move out of the working view

notify:
  # Pick something unlikely to collide — ntfy topics are a public global
  # namespace, not an account you own. Override with the NTFY_TOPIC env/secret.
  ntfy_topic: your-unique-job-alert-topic
